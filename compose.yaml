services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # لاحظ هنا كتبنا db بدل localhost لأنهم جوه شبكة Docker
      - DATABASE_URL=postgresql://postgres:dev@db:5432/tasks
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=tasks
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: